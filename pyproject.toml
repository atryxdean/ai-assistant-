[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-gemini-ai"
version = "0.1.0"
description = "Gemini-backed AI assistant with Obsidian-style permanent memory, reflection, online learning, and continual learning."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "google-genai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.scripts]
obsidian-gemini-ai = "obsidian_gemini_ai.cli:main"
obsidian-gemini-ai-gui = "obsidian_gemini_ai.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
