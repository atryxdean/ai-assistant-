# MITRE ATT&CK mapping for engin33r
# Version: 1
# Purpose: A canonical mapping between engin33r detections/components and MITRE ATT&CK tactics/techniques.
# Instructions:
# - Add one mapping entry per technique under `mappings`.
# - `component` should reference code, detection rule, or module in this repository (path or identifier).
# - `rule_id` is an optional internal rule or detection identifier.
# - `confidence` can be low/medium/high.
# - `references` may include ATT&CK URLs or other external documentation.

metadata:
  maintainer: atryxdean
  repo: atryxdean/engin33r
  created: 2026-07-08
  note: "This is a template. Fill in the `component` and `rule_id` values for each mapping."

mappings:
  - tactic: Initial Access
    technique_id: T1190
    technique_name: Exploit Public-Facing Application
    component: "" # e.g. webserver/proxy, scanner_detections
    rule_id: "" # e.g. rule-001
    confidence: medium
    notes: "Add path to detection or rule that would indicate exploitation attempts against public-facing services."
    references:
      - https://attack.mitre.org/techniques/T1190/

  - tactic: Execution
    technique_id: T1059.001
    technique_name: PowerShell
    component: "" # e.g. telemetry/powershell_monitor
    rule_id: ""
    confidence: medium
    notes: "Map PowerShell execution detections or logging to this technique."
    references:
      - https://attack.mitre.org/techniques/T1059/001/

  - tactic: Command and Control
    technique_id: T1071.001
    technique_name: Application Layer Protocol: Web Protocols
    component: "" # e.g. network/http/ingress_monitor
    rule_id: ""
    confidence: medium
    notes: "Map HTTP/HTTPS beacon detection rules here."
    references:
      - https://attack.mitre.org/techniques/T1071/001/

  - tactic: Persistence
    technique_id: T1547
    technique_name: Boot or Logon Autostart Execution
    component: "" # e.g. host/autorun_detection
    rule_id: ""
    confidence: low
    notes: "Map detections that indicate autorun entries or service manipulation."
    references:
      - https://attack.mitre.org/techniques/T1547/

# How to use this file
# - Keep this file up to date as new detections or rules are added to the repo.
# - When creating or updating detection rules, add a mapping entry that links the rule to one or more ATT&CK techniques.
# - Consider adding `attack_id` tags to rule metadata in code or rule files to enable automated extraction.

# Example automation idea (optional):
# - Add a script that scans repository rules for an `attack:` or `mitre:` tag and generates/updates this YAML automatically.
